[project]
name = "hic-diagonal-narrowing"
version = "0.1.0"
description = "Research framework for local Hi-C contact-width estimation and artifact-aware narrowing analysis"
readme = "README.md"
authors = [
    { name = "Grold Otieno", email = "groldotieno97@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
